<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Coach Abood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}" />
  <meta name="theme-color" content="#15171d" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    .login-card { width: min(380px, 92vw); background: var(--surface);
                  border: 1px solid var(--border); border-radius: 16px;
                  padding: 2rem 1.8rem; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .login-brand { display: flex; align-items: center; gap: .7rem; margin-bottom: 1.4rem; }
    .login-brand .brand-mark { width: 40px; height: 40px; border-radius: 11px;
        display: grid; place-items: center; font-weight: 800; color: var(--accent-ink);
        background: linear-gradient(150deg, var(--accent-bright), var(--accent)); }
    .login-brand b { font-size: 1.05rem; }
    .login-card label { display:block; font-size:.85rem; color: var(--text-2); margin-bottom:.4rem; }
    .login-card input { width: 100%; padding: .7rem .85rem; border-radius: 10px;
        border: 1px solid var(--border-strong); background: var(--surface-2);
        color: var(--text); font-size: 1rem; font-family: var(--mono); }
    .login-card input:focus { outline: none; border-color: var(--accent); }
    .login-card .btn-primary { width: 100%; justify-content: center; margin-top: 1rem; padding: .75rem; }
    .login-err { color: var(--red); font-size: .85rem; margin-top: .8rem; }
  </style>
</head>
<body>
  <form class="login-card" method="post">
    <div class="login-brand">
      <div class="brand-mark">CA</div>
      <div><b>Coach Abood</b><br><span class="metric-sub">control panel</span></div>
    </div>
    <label for="passcode">Passcode</label>
    <input id="passcode" name="passcode" type="password" autocomplete="current-password"
           autofocus placeholder="Enter the shared passcode" />
    <button type="submit" class="btn btn-primary">Sign in</button>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="login-err">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
  </form>
</body>
</html>
